<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rockview University - Garage System</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', Arial, sans-serif}
body{
  height:100vh;
  background: radial-gradient(1200px 600px at 50% -10%, #1e3a5f 0%, #0a1220 60%, #050a14 100%);
  display:flex;
  justify-content:center;
  align-items:center;
}
.card{
  width:420px;
  background: linear-gradient(180deg, #152a4a 0%, #101c33 100%);
  border-radius:22px;
  padding:32px 32px 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.06);
  text-align:center;
}
.logo{
  width:72px;height:72px;
  background:#f59e0b;
  border-radius:18px;
  display:flex;justify-content:center;align-items:center;
  margin:0 auto 18px;
  font-weight:900;font-size:30px;color:#2b1a00;
  box-shadow:0 8px 20px rgba(245,158,11,0.4);
}
h1{color:#fff;font-size:26px;font-weight:800;line-height:1.1}
h1 span{color:#f59e0b;display:block;font-size:22px;margin-top:2px}
.sub{color:#7a8fb0;font-size:13px;margin:8px 0 14px}
.badge{
  display:inline-block;
  background:rgba(245,158,11,0.12);
  border:1px solid rgba(245,158,11,0.25);
  color:#f59e0b;
  padding:5px 14px;border-radius:20px;
  font-size:10px;letter-spacing:2px;font-weight:700;
  margin-bottom:24px;
}
.input-group{
  background:#1a2d4d;
  border:1px solid #243a60;
  border-radius:14px;
  display:flex;align-items:center;
  padding:0 14px;
  height:48px;
  margin-bottom:14px;
}
.input-group input{
  background:transparent;border:none;outline:none;
  color:#fff;width:100%;margin-left:10px;font-size:14px;
}
.input-group input::placeholder{color:#6b7fa3}
.icon{font-size:16px}
.btn{
  width:100%;height:48px;
  background: linear-gradient(90deg, #3b9cf0, #1e73e6);
  border:none;border-radius:14px;
  color:#fff;font-weight:800;letter-spacing:0.5px;
  cursor:pointer;margin-top:8px;
  box-shadow:0 8px 20px rgba(30,115,230,0.4);
}
.btn:hover{background: linear-gradient(90deg, #4aa7ff, #2a82ff)}
.error{color:#ff5c5c;font-size:13px;margin-top:12px;display:none}
.footer{margin-top:22px;color:#5d7296;font-size:10px;letter-spacing:1px}
.footer b{color:#8aa0c4;display:block;font-size:11px;margin-bottom:4px;letter-spacing:1.5px}
</style>
</head>
<body>

<div class="card">
  <div class="logo">BG</div>
  <h1>Rockview University <span>Garage System</span></h1>
  <p class="sub">Garage Records Management System</p>
  <div class="badge">SECURE LOGIN PORTAL</div>

  <form id="loginForm">
    <div class="input-group">
      <span class="icon">👤</span>
      <input type="text" id="username" placeholder="Enter Username" required>
    </div>
    <div class="input-group">
      <span class="icon">🔒</span>
      <input type="password" id="password" placeholder="Enter Password" required>
    </div>
    <button type="submit" class="btn">LOGIN TO GARAGE →</button>
    <div id="error" class="error">Wrong username or password! Try bob / bob123</div>
  </form>

  <div class="footer">
    <b>ROCKVIEW UNIVERSITY</b>
    Secure access only • Authorized personnel<br>
    © 2026 Rockview University
  </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  let u = document.getElementById("username").value.toLowerCase().trim();
  let p = document.getElementById("password").value.trim();

  if(u==="bob" && p==="bob123"){
    localStorage.setItem("user","Owner Bob");
    window.location.href="dashbord.html";
  }
  else if(u==="mwansa" && p==="mwansa123"){
    localStorage.setItem("user","M. Mwansa");
    window.location.href="dashbord.html";
  }
  else if(u==="bphiri" && p==="bphiri123"){
    localStorage.setItem("user","Bphiri");
    window.location.href="dashbord.html";
  }
  else{
    document.getElementById("error").style.display="block";
  }
});
</script>

</body>
</html>
